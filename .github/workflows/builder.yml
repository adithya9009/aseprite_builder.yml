name: Build Aseprite

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Set up Ninja
      uses: llvm/actions/install-ninja@main

    - name: Set up MSVC environment
      uses: ilammy/msvc-dev-cmd@v1

    - name: Download Skia Release
      shell: bash
      run: |
        curl -L -o skia.zip https://github.com/aseprite/skia/releases/download/m102-861e4743af/Skia-Windows-Release-x64.zip
        7z x skia.zip -oskia
    - name: Create Skia stub files
      shell: bash
      run: |
        mkdir -p skia/third_party/externals/icu/flutter
        touch skia/third_party/externals/icu/flutter/icudtl.dat
        mkdir -p skia/third_party/externals/libjpeg-turbo

    - name: Download Aseprite source
      shell: bash
      run: |
        curl -sL https://api.github.com/repos/aseprite/aseprite/releases/latest \
          | grep "browser_download_url.*Source.zip" \
          | cut -d '"' -f 4 \
          | xargs curl -L -o aseprite-source.zip
        7z x aseprite-source.zip -oaseprite

    - name: Configure CMake
      shell: bash
      run: |
        SKIA_ABS_PATH="$(pwd)/skia"
        cd aseprite
        mkdir build
        cd build
        cmake .. -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DENABLE_UI=ON \
          -DLAF_BACKEND=skia \
          -DSKIA_DIR="$SKIA_ABS_PATH" \
          -DSKIA_LIBRARY_DIR="$SKIA_ABS_PATH/out/Release-x64" \
          -DSKIA_LIBRARY="$SKIA_ABS_PATH/out/Release-x64/skia.lib"

    - name: Build Aseprite
      shell: bash
      run: |
        cd aseprite/build
        ninja aseprite

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Aseprite-Windows
        path: aseprite/build/bin/
