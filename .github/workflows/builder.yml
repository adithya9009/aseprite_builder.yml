name: build-aseprite
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      # KEY FIX: strip Git for Windows' usr/bin from PATH
      # so its gawk.exe / MSYS DLLs don't interfere with libpng's
      # genout.cmake script during the CMake/Ninja build.
      - name: Clean PATH (remove Git usr/bin)
        shell: bash
        run: |
          echo "PATH=$(echo "$PATH" | sed -e 's|:/c/Program Files/Git/usr/bin||' -e 's|/c/Program Files/Git/usr/bin:||')" >> $GITHUB_ENV

      - name: Configure CMake
        shell: cmd
        run: |
          cd aseprite
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=RelWithDebInfo -G Ninja ..

      - name: Build
        shell: cmd
        run: |
          cd aseprite/build
          ninja aseprite
